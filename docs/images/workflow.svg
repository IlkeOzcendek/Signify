<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">The Signify verification workflow</title>
  <desc id="desc">Five stages: upload or camera capture; preprocessing and quality checks; image-profile routing to General v1, Low-res v2 or Mono v3; reference comparison with match, uncertain or non-match decisions; and history with PDF reporting.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141728"/>
      <stop offset="1" stop-color="#0D101E"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="145" x2="0" y2="455" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22223C"/>
      <stop offset="1" stop-color="#191C30"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="5.5" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1L5.5 4L1 7" stroke="#9B8CE1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x=".5" y=".5" width="1279" height="519" rx="24" fill="url(#background)" stroke="#363750"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <text x="40" y="61" fill="#A99AFF" font-size="13" font-weight="600" letter-spacing="2.5">THE WORKFLOW</text>
    <text x="40" y="105" fill="#F0EDFF" font-size="31" font-weight="650" letter-spacing="-.7">From a signature image to a reviewable result.</text>
    <rect x="40" y="145" width="224" height="310" rx="18" fill="url(#card)" stroke="#3C3B58"/>
    <rect x="284" y="145" width="224" height="310" rx="18" fill="url(#card)" stroke="#3C3B58"/>
    <rect x="528" y="145" width="224" height="310" rx="18" fill="url(#card)" stroke="#705CFF" stroke-opacity=".8"/>
    <rect x="772" y="145" width="224" height="310" rx="18" fill="url(#card)" stroke="#3C3B58"/>
    <rect x="1016" y="145" width="224" height="310" rx="18" fill="url(#card)" stroke="#3C3B58"/>
    <path d="M266 290H280M510 290H524M754 290H768M998 290H1012" stroke="#9B8CE1" stroke-width="1.5" marker-end="url(#arrow)"/>

    <text x="62" y="178" fill="#8C82AF" font-size="13" font-weight="600" letter-spacing="1.5">01 / CAPTURE</text>
    <rect x="62" y="200" width="48" height="48" rx="13" fill="#705CFF" fill-opacity=".17"/>
    <g stroke="#BDAFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M73 229V235H99V229M86 232V213M79 220L86 213L93 220"/>
    </g>
    <text x="62" y="283" fill="#F0EDFF" font-size="22" font-weight="600">Upload</text>
    <text x="62" y="310" fill="#F0EDFF" font-size="22" font-weight="600">or camera</text>
    <text x="62" y="350" fill="#B3ADC9" font-size="16">Add reference images</text>
    <text x="62" y="375" fill="#B3ADC9" font-size="16">and a query signature.</text>
    <path d="M62 403H242" stroke="#36334E"/>
    <text x="62" y="431" fill="#9088AB" font-size="14">Image input</text>

    <text x="306" y="178" fill="#8C82AF" font-size="13" font-weight="600" letter-spacing="1.5">02 / PREPARE</text>
    <rect x="306" y="200" width="48" height="48" rx="13" fill="#705CFF" fill-opacity=".17"/>
    <g stroke="#BDAFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M317 215H343M317 224H343M317 233H343"/>
      <circle cx="324" cy="215" r="3" fill="#292445"/>
      <circle cx="337" cy="224" r="3" fill="#292445"/>
      <circle cx="327" cy="233" r="3" fill="#292445"/>
    </g>
    <text x="306" y="283" fill="#F0EDFF" font-size="22" font-weight="600">Preprocessing</text>
    <text x="306" y="310" fill="#F0EDFF" font-size="22" font-weight="600">&amp; quality</text>
    <text x="306" y="350" fill="#B3ADC9" font-size="16">Normalize image inputs.</text>
    <text x="306" y="375" fill="#B3ADC9" font-size="16">Check signature quality.</text>
    <path d="M306 403H486" stroke="#36334E"/>
    <text x="306" y="431" fill="#9088AB" font-size="14">OpenCV processing</text>

    <text x="550" y="178" fill="#AB9AFF" font-size="13" font-weight="600" letter-spacing="1.5">03 / ROUTE</text>
    <rect x="550" y="200" width="48" height="48" rx="13" fill="#705CFF" fill-opacity=".23"/>
    <g stroke="#C3B5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M565 224H574M574 215V233M574 215H582M574 224H582M574 233H582"/>
      <circle cx="562" cy="224" r="3" fill="#302951"/>
      <circle cx="585" cy="215" r="2.5" fill="#302951"/>
      <circle cx="585" cy="224" r="2.5" fill="#302951"/>
      <circle cx="585" cy="233" r="2.5" fill="#302951"/>
    </g>
    <text x="550" y="283" fill="#F0EDFF" font-size="22" font-weight="600">Image-profile</text>
    <text x="550" y="310" fill="#F0EDFF" font-size="22" font-weight="600">routing</text>
    <circle cx="555" cy="344" r="3" fill="#A99AFF"/>
    <text x="568" y="350" fill="#C2B9E0" font-size="16">General v1</text>
    <circle cx="555" cy="369" r="3" fill="#A99AFF"/>
    <text x="568" y="375" fill="#C2B9E0" font-size="16">Low-res v2</text>
    <circle cx="555" cy="394" r="3" fill="#A99AFF"/>
    <text x="568" y="400" fill="#C2B9E0" font-size="16">Mono v3</text>
    <text x="550" y="431" fill="#9088AB" font-size="14">Select comparison profile</text>

    <text x="794" y="178" fill="#8C82AF" font-size="13" font-weight="600" letter-spacing="1.5">04 / COMPARE</text>
    <rect x="794" y="200" width="48" height="48" rx="13" fill="#705CFF" fill-opacity=".17"/>
    <g stroke="#BDAFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M804 218H831M826 213L831 218L826 223M831 231H804M809 226L804 231L809 236"/>
    </g>
    <text x="794" y="283" fill="#F0EDFF" font-size="22" font-weight="600">Reference</text>
    <text x="794" y="310" fill="#F0EDFF" font-size="22" font-weight="600">comparison</text>
    <circle cx="799" cy="344" r="3" fill="#B7A8FF"/>
    <text x="812" y="350" fill="#C2B9E0" font-size="16">Match</text>
    <circle cx="799" cy="369" r="3" fill="#B7A8FF"/>
    <text x="812" y="375" fill="#C2B9E0" font-size="16">Uncertain</text>
    <circle cx="799" cy="394" r="3" fill="#B7A8FF"/>
    <text x="812" y="400" fill="#C2B9E0" font-size="16">Non-match</text>
    <text x="794" y="431" fill="#9088AB" font-size="14">Multiple-reference support</text>

    <text x="1038" y="178" fill="#8C82AF" font-size="13" font-weight="600" letter-spacing="1.5">05 / REVIEW</text>
    <rect x="1038" y="200" width="48" height="48" rx="13" fill="#705CFF" fill-opacity=".17"/>
    <g stroke="#BDAFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1053 211H1068L1075 218V237H1053V211Z"/>
      <path d="M1067 211V219H1075M1058 225H1069M1058 231H1066"/>
    </g>
    <text x="1038" y="283" fill="#F0EDFF" font-size="22" font-weight="600">History</text>
    <text x="1038" y="310" fill="#F0EDFF" font-size="22" font-weight="600">&amp; PDF</text>
    <text x="1038" y="350" fill="#B3ADC9" font-size="16">Review saved records.</text>
    <text x="1038" y="375" fill="#B3ADC9" font-size="16">Export a readable report.</text>
    <path d="M1038 403H1218" stroke="#36334E"/>
    <text x="1038" y="431" fill="#9088AB" font-size="14">Traceable workflow</text>
    <text x="40" y="490" fill="#938BAE" font-size="14">Built to support human review.</text>
    <text x="1240" y="490" text-anchor="end" fill="#938BAE" font-size="14">SIGNIFY</text>
  </g>
</svg>
