      <path d="M963 207H979M976 204L979 207L976 210M979 214H963M966 211L963 214L966 217" stroke="#F1EDFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="748" cy="300" r="4" fill="#AA99FF"/>
      <text x="763" y="306" fill="#EAE5FC" font-size="18" font-weight="600">Reviewable comparisons</text>
      <text x="746" y="333" fill="#A49DBE" font-size="14">Quality checks · Multiple reference signatures</text>
      <text x="971" y="391" text-anchor="middle" fill="#8E88A9" font-size="13">Abstract signature illustrations</text>
    </g>
  </g>
