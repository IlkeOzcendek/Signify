      <text x="1001" y="139" fill="#A7A1C5" font-size="12" font-weight="600" letter-spacing="1.7">QUERY IMAGE</text>
      <rect x="740" y="154" width="212" height="112" rx="12" fill="#F2EFFE"/>
      <rect x="990" y="154" width="212" height="112" rx="12" fill="#F2EFFE"/>
      <path d="M756 231H936M1006 231H1186" stroke="#B1A8CF" stroke-opacity=".35"/>
      <path d="M758 218C773 206 808 176 812 189C819 210 775 238 783 216C791 195 820 188 813 208C809 221 811 222 820 206C836 179 827 226 841 215C847 209 848 196 851 200C853 205 849 218 857 216C867 212 867 199 871 204C879 223 893 200 899 207C904 214 920 210 932 203M777 232C821 228 880 226 926 227" stroke="#4E4381" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1008 219C1024 208 1057 179 1063 191C1072 211 1026 236 1035 215C1043 197 1069 188 1065 208C1062 222 1063 223 1074 207C1088 183 1079 225 1094 215C1100 208 1100 198 1104 201C1107 207 1100 216 1110 216C1119 214 1119 201 1124 205C1132 223 1145 202 1152 209C1157 215 1174 212 1186 204M1029 232C1077 229 1127 227 1180 228" stroke="#705CFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
