<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Signify — Signature verification, from image to insight.</title>
  <desc id="desc">A dark navy and violet introduction to the Signify decision-support MVP, built with computer vision, PyTorch and Streamlit. Two abstract signature illustrations represent reference and query images.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#15182B"/>
      <stop offset="1" stop-color="#0B0E1B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1034 116) rotate(141) scale(630 425)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#705CFF" stop-opacity=".2"/>
      <stop offset="1" stop-color="#705CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="56" y1="85" x2="324" y2="167" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D8D1FF"/>
      <stop offset="1" stop-color="#A99AFF"/>
    </linearGradient>
    <linearGradient id="card" x1="726" y1="110" x2="1220" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22233C"/>
      <stop offset="1" stop-color="#171A2E"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#A89BEA" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="bounds">
      <rect width="1280" height="440" rx="24"/>
    </clipPath>
  </defs>
  <g clip-path="url(#bounds)">
    <rect width="1280" height="440" fill="url(#background)"/>
    <rect width="1280" height="440" fill="url(#glow)"/>
    <rect width="1280" height="440" fill="url(#grid)"/>
    <path d="M693 0L539 440" stroke="#C7BEFF" stroke-opacity=".06"/>
    <path d="M837 0L683 440" stroke="#C7BEFF" stroke-opacity=".04"/>
    <rect x=".5" y=".5" width="1279" height="439" rx="23.5" stroke="#363750"/>
    <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <rect x="56" y="40" width="32" height="32" rx="10" fill="#705CFF"/>
      <path d="M65 60C62 55 69 47 76 48C84 50 66 64 65 62C64 60 79 56 81 61" stroke="#F6F3FF" stroke-width="2.1" stroke-linecap="round"/>
