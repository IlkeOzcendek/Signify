      <text x="54" y="155" fill="url(#accent)" font-size="76" font-weight="750" letter-spacing="-3">Signify</text>
      <text x="58" y="208" fill="#F0EDFF" font-size="29" font-weight="500" letter-spacing="-.5">Signature verification,</text>
      <text x="58" y="246" fill="#F0EDFF" font-size="29" font-weight="500" letter-spacing="-.5">from image to insight.</text>
      <rect x="58" y="287" width="172" height="36" rx="18" fill="#705CFF" fill-opacity=".17" stroke="#705CFF" stroke-opacity=".5"/>
      <text x="144" y="310" text-anchor="middle" fill="#D9D2FF" font-size="15" font-weight="600">Computer Vision</text>
      <rect x="240" y="287" width="105" height="36" rx="18" fill="#1A1D31" stroke="#3C3C58"/>
      <text x="292.5" y="310" text-anchor="middle" fill="#C9C6DC" font-size="15" font-weight="600">PyTorch</text>
      <rect x="355" y="287" width="115" height="36" rx="18" fill="#1A1D31" stroke="#3C3C58"/>
      <text x="412.5" y="310" text-anchor="middle" fill="#C9C6DC" font-size="15" font-weight="600">Streamlit</text>
      <text x="58" y="390" fill="#9593B2" font-size="17">Compare</text>
      <circle cx="144" cy="384" r="2" fill="#705CFF"/>
      <text x="162" y="390" fill="#9593B2" font-size="17">Review</text>
      <circle cx="235" cy="384" r="2" fill="#705CFF"/>
      <text x="253" y="390" fill="#9593B2" font-size="17">Report</text>

      <rect x="1010" y="42" width="214" height="32" rx="16" fill="#1F2037" stroke="#514A7F"/>
      <circle cx="1028" cy="58" r="3.5" fill="#AB9BFF"/>
